<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Volare chat widget — local test</title>
    <style>
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        max-width: 640px;
        margin: 0 auto;
        padding: 64px 24px;
        color: #111827;
        line-height: 1.6;
      }
      h1 { font-size: 26px; margin-bottom: 8px; }
      p { color: #4b5563; }
      code {
        background: #f3f4f6;
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 13px;
      }
      button {
        margin-top: 20px;
        padding: 10px 18px;
        border: 0;
        border-radius: 8px;
        background: #111827;
        color: #fff;
        font-size: 14px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>Widget test page</h1>
    <p>
      The launcher should appear bottom-right. This page exists only to verify the
      widget locally before handing over the embed snippet — it is not deployed to the
      client's site.
    </p>
    <p>
      Run <code>vercel dev</code> from the project root, then open
      <code>http://localhost:3000/demo.html</code>.
    </p>
    <button onclick="window.VolareChat.reset()">Reset conversation</button>

    <script src="/widget.js" data-api="/api/chat" defer></script>
  </body>
</html>
